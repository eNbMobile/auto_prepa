name: Annuler une commande

# Annulation manuelle d'une commande dont le mail d'annulation n'est jamais
# arrive : meme traitement qu'a la reception de ce mail.

on:
  workflow_dispatch:
    inputs:
      numero:
        description: "Numéro de la commande à annuler"
        required: true
        type: string

# Meme groupe qu'auto_prepa : jamais en parallele d'un traitement de mails.
concurrency:
  group: aut_prep
  cancel-in-progress: false

jobs:
  annuler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip et pdftotext
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Annuler la commande
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          GITHUB_TOKEN:           ${{ github.token }}
          WORK_DIR: "v 4.0.0"
          PYTHONUNBUFFERED:       "1"
          CDE_NUMERO: ${{ inputs.numero }}
        run: python3 annuler_commande.py --numero "$CDE_NUMERO"

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
