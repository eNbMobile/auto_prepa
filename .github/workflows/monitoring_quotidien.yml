name: Monitoring Quotidien aut_prep

on:
  schedule:
    - cron: '0 8 * * *'   # 10h00 Paris (CEST = UTC+2)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Analyser les runs aut_prep des 24 dernières heures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("GH_TOKEN", "")
          owner, repo = os.environ.get("REPO", "eNbMobile/auto_prepa").split("/", 1)
          H = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=H)
              return json.loads(urllib.request.urlopen(req).read())

          def api_post(url, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={**H, "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  return json.loads(urllib.request.urlopen(req).read())
              except Exception as e:
                  print(f"  POST {url} -> {e}", flush=True)
                  return None

          now   = datetime.now(timezone.utc)
          since = now - timedelta(hours=24)
          print(f"Fenetre : {since.strftime('%Y-%m-%d %H:%M')} -> {now.strftime('%Y-%m-%d %H:%M')} UTC", flush=True)

          # Recuperer tous les runs des 24 dernieres heures (pagination)
          all_runs = []
          page = 1
          while True:
              data = api_get(
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/actions/workflows/auto_prepa.yml/runs"
                  f"?per_page=100&page={page}"
              )
              runs = data.get("workflow_runs", [])
              if not runs:
                  break
              stop = False
              for run in runs:
                  created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                  if created >= since:
                      all_runs.append(run)
                  else:
                      stop = True
              if stop or len(runs) < 100:
                  break
              page += 1
              if page > 20:
                  print("  Limite de pagination (20 pages) atteinte.", flush=True)
                  break

          print(f"{len(all_runs)} runs trouves.", flush=True)

          # Analyse
          succes   = [r for r in all_runs if r.get("conclusion") == "success"]
          echecs   = [r for r in all_runs if r.get("conclusion") == "failure"]
          annules  = [r for r in all_runs if r.get("conclusion") in ("cancelled", "skipped")]
          en_cours = [r for r in all_runs if r.get("status") != "completed"]

          # Detection des interruptions
          triees = sorted(all_runs, key=lambda r: r["created_at"])
          gaps_alarme = []
          gap_max = 0.0
          for i in range(1, len(triees)):
              t1 = datetime.fromisoformat(triees[i-1]["created_at"].replace("Z", "+00:00"))
              t2 = datetime.fromisoformat(triees[i]["created_at"].replace("Z", "+00:00"))
              g = (t2 - t1).total_seconds() / 60.0
              if g > gap_max:
                  gap_max = g
              if g > 15:
                  gaps_alarme.append(
                      f"  - {g:.0f} min entre {t1.strftime('%H:%M')} et {t2.strftime('%H:%M')} UTC"
                  )

          probleme = len(echecs) > 0 or len(all_runs) == 0 or len(gaps_alarme) > 0

          # Construction du rapport
          icone   = "ALERTE" if probleme else "OK"
          date_fr = now.strftime("%d/%m/%Y")
          lignes  = [
              f"## [{icone}] Monitoring aut_prep - {date_fr}",
              "",
              "### Bilan 24 h",
              "| Statut | Nb |",
              "|--------|----|",
              f"| Succes   | {len(succes)} |",
              f"| Echecs   | {len(echecs)} |",
              f"| Annules  | {len(annules)} |",
              f"| En cours | {len(en_cours)} |",
              f"| **Total** | **{len(all_runs)}** |",
              f"| Gap max entre runs | {gap_max:.0f} min |",
          ]

          if not all_runs:
              lignes += [
                  "",
                  "### ALERTE CRITIQUE",
                  "Aucun run aut_prep detecte dans les 24 dernieres heures !",
                  "Le scheduler externe semble etre arrete.",
              ]

          if echecs:
              lignes += ["", "### Runs en echec"]
              for r in echecs[:20]:
                  h = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%H:%M")
                  lignes.append(f"- [Run #{r['run_number']}]({r['html_url']}) a {h} UTC")

          if gaps_alarme:
              lignes += ["", "### Interruptions du scheduler (> 15 min)"]
              lignes += gaps_alarme[:10]

          if not probleme:
              lignes += [
                  "",
                  f"> Tout fonctionne correctement : {len(succes)} executions reussies en 24 h.",
              ]

          rapport = "\n".join(lignes)
          print("\n" + rapport, flush=True)

          # Creer une issue GitHub si probleme detecte
          if probleme:
              base = f"https://api.github.com/repos/{owner}/{repo}"
              # Creer le label si necessaire (echec silencieux si deja existant)
              api_post(f"{base}/labels", {
                  "name": "monitoring",
                  "color": "e11d48",
                  "description": "Surveillance automatique aut_prep",
              })
              issue = api_post(
                  f"{base}/issues",
                  {
                      "title": f"[MONITORING] Anomalie aut_prep - {date_fr}",
                      "body": rapport,
                      "labels": ["monitoring"],
                  },
              )
              if issue:
                  print(f"\nIssue creee : {issue['html_url']}", flush=True)
              sys.exit(1)
          PYEOF
