name: Monitoring Quotidien

on:
  schedule:
    - cron: '0 8 * * *'   # 10h00 Paris (CEST = UTC+2)
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Analyser les workflows des 24 dernières heures
        id: analyse
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("GH_TOKEN", "")
          owner, repo = os.environ.get("REPO", "eNbMobile/auto_prepa").split("/", 1)
          H = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=H)
              return json.loads(urllib.request.urlopen(req, timeout=30).read())

          def api_post(url, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={**H, "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=30).read())
              except urllib.error.HTTPError as e:
                  if e.code == 422:
                      return None
                  print(f"  POST {url} -> HTTP {e.code}", flush=True)
                  return None
              except Exception as e:
                  print(f"  POST {url} -> {e}", flush=True)
                  return None

          def api_patch(url, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={**H, "Content-Type": "application/json"},
                  method="PATCH",
              )
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=30).read())
              except Exception as e:
                  print(f"  PATCH {url} -> {e}", flush=True)
                  return None

          now   = datetime.now(timezone.utc)
          since = now - timedelta(hours=24)
          print(f"Fenêtre : {since.strftime('%Y-%m-%d %H:%M')} → {now.strftime('%Y-%m-%d %H:%M')} UTC", flush=True)

          # ─── Fonction générique : récupérer les runs d'un workflow sur 24h ───
          def get_runs_24h(workflow_file, max_pages=20):
              runs = []
              page = 1
              while page <= max_pages:
                  data = api_get(
                      f"https://api.github.com/repos/{owner}/{repo}"
                      f"/actions/workflows/{workflow_file}/runs"
                      f"?per_page=100&page={page}"
                  )
                  batch = data.get("workflow_runs", [])
                  if not batch:
                      break
                  stop = False
                  for run in batch:
                      created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                      if created >= since:
                          runs.append(run)
                      else:
                          stop = True
                  if stop or len(batch) < 100:
                      break
                  page += 1
              return runs

          # ─── Récupérer les logs d'un run échoué ──────────────────────────────
          def get_failed_job_logs(run_id, max_chars=8000):
              try:
                  jobs_data = api_get(
                      f"https://api.github.com/repos/{owner}/{repo}"
                      f"/actions/runs/{run_id}/jobs"
                  )
                  logs_parts = []
                  for job in jobs_data.get("jobs", []):
                      if job.get("conclusion") == "failure":
                          job_id = job["id"]
                          try:
                              log_req = urllib.request.Request(
                                  f"https://api.github.com/repos/{owner}/{repo}"
                                  f"/actions/jobs/{job_id}/logs",
                                  headers=H,
                              )
                              raw = urllib.request.urlopen(log_req, timeout=30).read().decode("utf-8", errors="replace")
                              # Garder la fin des logs (les erreurs sont souvent à la fin)
                              logs_parts.append(f"=== Job: {job['name']} ===\n{raw[-4000:]}")
                          except Exception as e:
                              logs_parts.append(f"=== Job: {job['name']} === (logs indisponibles: {e})")
                  return "\n\n".join(logs_parts)[:max_chars]
              except Exception as e:
                  return f"Impossible de récupérer les logs : {e}"

          # ─── Appel Claude API pour analyse ───────────────────────────────────
          def analyser_avec_claude(contexte_echecs):
              api_key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
              if not api_key:
                  return None
              try:
                  prompt = f"""Tu es un assistant DevOps qui analyse des échecs de GitHub Actions pour le projet auto_prepa (eNbMobile/auto_prepa).

Voici les informations sur les runs en échec du workflow aut_prep (auto_prepa.yml) des dernières 24h :

{contexte_echecs}

Le workflow aut_prep :
1. Vérifie les nouveaux emails Gmail via l'API Google (token OAuth2)
2. Si nouveaux emails : installe poppler-utils, pip deps, exécute bootstrap.py auto_prepa.py
3. Met à jour le secret GOOGLE_TOKEN_JSON si le token a été rafraîchi

Analyse les logs et réponds en JSON avec ce format exact :
{{
  "cause_probable": "description courte de la cause",
  "type_erreur": "token_expire|package_manquant|bug_code|reseau|autre",
  "solution": "description de la solution",
  "corrigeable_automatiquement": true|false,
  "fichier_a_modifier": "chemin/vers/fichier ou null",
  "modification_suggéree": "description de la modification ou null"
}}"""

                  body = json.dumps({
                      "model": "claude-haiku-4-5-20251001",
                      "max_tokens": 1024,
                      "messages": [{"role": "user", "content": prompt}]
                  }).encode()
                  req = urllib.request.Request(
                      "https://api.anthropic.com/v1/messages",
                      data=body,
                      headers={
                          "x-api-key": api_key,
                          "anthropic-version": "2023-06-01",
                          "content-type": "application/json",
                      },
                  )
                  resp = json.loads(urllib.request.urlopen(req, timeout=60).read())
                  text = resp["content"][0]["text"].strip()
                  # Extraire le JSON de la réponse
                  if "```json" in text:
                      text = text.split("```json")[1].split("```")[0].strip()
                  elif "```" in text:
                      text = text.split("```")[1].split("```")[0].strip()
                  return json.loads(text)
              except Exception as e:
                  print(f"  Erreur appel Claude : {e}", flush=True)
                  return None

          # ─── Analyse aut_prep ─────────────────────────────────────────────
          print("\n=== aut_prep ===", flush=True)
          aut_runs = get_runs_24h("auto_prepa.yml")
          aut_succes  = [r for r in aut_runs if r.get("conclusion") == "success"]
          aut_echecs  = [r for r in aut_runs if r.get("conclusion") == "failure"]
          aut_triees  = sorted(aut_runs, key=lambda r: r["created_at"])
          aut_gap_max = 0.0
          aut_gaps_alarme = []
          for i in range(1, len(aut_triees)):
              t1 = datetime.fromisoformat(aut_triees[i-1]["created_at"].replace("Z", "+00:00"))
              t2 = datetime.fromisoformat(aut_triees[i]["created_at"].replace("Z", "+00:00"))
              g  = (t2 - t1).total_seconds() / 60.0
              if g > aut_gap_max:
                  aut_gap_max = g
              if g > 15:
                  aut_gaps_alarme.append(
                      f"  - {g:.0f} min entre {t1.strftime('%H:%M')} et {t2.strftime('%H:%M')} UTC"
                  )
          print(f"  {len(aut_runs)} runs — {len(aut_succes)} ✅ {len(aut_echecs)} ❌  gap_max={aut_gap_max:.0f}min", flush=True)

          # ─── Analyse collecte_ean ─────────────────────────────────────────
          print("\n=== collecte_ean ===", flush=True)
          ean_runs   = get_runs_24h("collecte_ean.yml", max_pages=5)
          ean_succes = [r for r in ean_runs if r.get("conclusion") == "success"]
          ean_echecs = [r for r in ean_runs if r.get("conclusion") == "failure"]
          print(f"  {len(ean_runs)} runs — {len(ean_succes)} ✅ {len(ean_echecs)} ❌", flush=True)

          # ─── Analyse fix_anomalies ────────────────────────────────────────
          print("\n=== fix_anomalies ===", flush=True)
          fix_runs   = get_runs_24h("fix_anomalies.yml", max_pages=2)
          fix_succes = [r for r in fix_runs if r.get("conclusion") == "success"]
          fix_echecs = [r for r in fix_runs if r.get("conclusion") == "failure"]
          print(f"  {len(fix_runs)} runs — {len(fix_succes)} ✅ {len(fix_echecs)} ❌", flush=True)

          # ─── Décision globale ─────────────────────────────────────────────
          probleme = (
              len(aut_echecs) > 0
              or len(aut_runs) == 0
              or len(aut_gaps_alarme) > 0
              or len(ean_echecs) > 0
              or len(fix_echecs) > 0
          )

          # ─── Analyse Claude des échecs aut_prep ──────────────────────────
          analyse_claude = None
          if aut_echecs:
              print("\nRécupération des logs des runs en échec...", flush=True)
              logs_echecs = []
              for r in aut_echecs[:3]:  # Max 3 runs pour ne pas dépasser les quotas
                  h = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%H:%M UTC")
                  logs = get_failed_job_logs(r["id"])
                  logs_echecs.append(f"Run #{r['run_number']} à {h} :\n{logs}")

              contexte = "\n\n".join(logs_echecs)
              print("Appel Claude API pour analyse...", flush=True)
              analyse_claude = analyser_avec_claude(contexte)
              if analyse_claude:
                  print(f"  Cause : {analyse_claude.get('cause_probable', '?')}", flush=True)
                  print(f"  Type  : {analyse_claude.get('type_erreur', '?')}", flush=True)

          # ─── Rapport ─────────────────────────────────────────────────────
          date_fr = now.strftime("%d/%m/%Y")
          icone   = "ALERTE" if probleme else "OK"
          lines   = [
              f"## [{icone}] Monitoring quotidien — {date_fr}",
              "",
              "### Bilan 24 h",
              "",
              "| Workflow | Runs | Succès | Échecs | Note |",
              "|----------|------|--------|--------|------|",
              f"| `aut_prep` | {len(aut_runs)} | {len(aut_succes)} | {len(aut_echecs)} | gap_max {aut_gap_max:.0f} min |",
              f"| `collecte_ean` | {len(ean_runs)} | {len(ean_succes)} | {len(ean_echecs)} | — |",
              f"| `fix_anomalies` | {len(fix_runs)} | {len(fix_succes)} | {len(fix_echecs)} | — |",
          ]

          if len(aut_runs) == 0:
              lines += [
                  "",
                  "### 🚨 ALERTE CRITIQUE — aut_prep",
                  "Aucun run détecté en 24 h. Le scheduler externe (cron-job.org) semble arrêté.",
              ]

          if aut_echecs:
              lines += ["", "### ❌ Runs aut_prep en échec"]
              for r in aut_echecs[:20]:
                  h = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%H:%M UTC")
                  lines.append(f"- [Run #{r['run_number']}]({r['html_url']}) à {h}")

          if analyse_claude:
              lines += [
                  "",
                  "### 🤖 Analyse automatique (Claude)",
                  "",
                  f"**Cause probable :** {analyse_claude.get('cause_probable', 'Inconnue')}",
                  f"**Type d'erreur :** `{analyse_claude.get('type_erreur', 'autre')}`",
                  f"**Solution proposée :** {analyse_claude.get('solution', 'Voir les logs')}",
              ]
              if analyse_claude.get("corrigeable_automatiquement"):
                  lines.append(f"\n> ⚠️ Une correction automatique peut être appliquée — voir ci-dessous.")
              else:
                  lines.append("\n> ℹ️ Cette erreur nécessite une intervention manuelle.")

          if aut_gaps_alarme:
              lines += ["", "### ⚠️ Interruptions scheduler aut_prep (> 15 min)"]
              lines += aut_gaps_alarme[:10]

          if ean_echecs:
              lines += ["", "### ❌ Runs collecte_ean en échec"]
              for r in ean_echecs[:10]:
                  h = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%H:%M UTC")
                  lines.append(f"- [Run #{r['run_number']}]({r['html_url']}) à {h}")

          if fix_echecs:
              lines += ["", "### ❌ Runs fix_anomalies en échec"]
              for r in fix_echecs[:5]:
                  h = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%H:%M UTC")
                  lines.append(f"- [Run #{r['run_number']}]({r['html_url']}) à {h}")

          if not probleme:
              lines += [
                  "",
                  f"> ✅ Tout fonctionne : {len(aut_succes)} runs aut_prep réussis, "
                  f"collecte_ean {len(ean_succes)}/{len(ean_runs)}, fix_anomalies {len(fix_succes)}/{len(fix_runs)}.",
              ]

          rapport = "\n".join(lines)
          print("\n" + rapport, flush=True)

          # ─── Écrire le step summary GitHub ───────────────────────────────
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_file:
              with open(summary_file, "a") as f:
                  f.write(rapport + "\n")

          # ─── Sauvegarder les infos pour le step suivant ───────────────────
          with open("/tmp/monitoring_result.json", "w") as f:
              json.dump({
                  "probleme": probleme,
                  "date_fr": date_fr,
                  "rapport": rapport,
                  "aut_echecs": [{"run_number": r["run_number"], "html_url": r["html_url"]} for r in aut_echecs[:5]],
                  "analyse_claude": analyse_claude,
                  "aut_runs_count": len(aut_runs),
                  "aut_succes_count": len(aut_succes),
                  "aut_echecs_count": len(aut_echecs),
              }, f)

          # ─── Créer une issue GitHub si problème ───────────────────────────
          if probleme:
              base = f"https://api.github.com/repos/{owner}/{repo}"
              api_post(f"{base}/labels", {
                  "name": "monitoring",
                  "color": "e11d48",
                  "description": "Surveillance automatique workflows",
              })
              issue = api_post(f"{base}/issues", {
                  "title": f"[MONITORING] Anomalie détectée — {date_fr}",
                  "body": rapport,
                  "labels": ["monitoring"],
              })
              if issue:
                  print(f"\nIssue créée : {issue['html_url']}", flush=True)
                  with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                      f.write(f"issue_url={issue['html_url']}\n")
              sys.exit(1)
          PYEOF

      - name: Appliquer une correction automatique si possible
        if: failure() && steps.analyse.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, base64, urllib.request
          from datetime import datetime, timezone

          result_file = "/tmp/monitoring_result.json"
          if not os.path.exists(result_file):
              print("Pas de résultat de monitoring → skip")
              sys.exit(0)

          with open(result_file) as f:
              result = json.load(f)

          analyse = result.get("analyse_claude")
          if not analyse:
              print("Pas d'analyse Claude disponible → skip")
              sys.exit(0)

          if not analyse.get("corrigeable_automatiquement"):
              print(f"Erreur non corrigeable automatiquement : {analyse.get('type_erreur')}")
              print(f"Action manuelle requise : {analyse.get('solution')}")
              sys.exit(0)

          type_erreur = analyse.get("type_erreur", "")
          token = os.environ.get("GH_TOKEN", "")
          owner, repo = os.environ.get("REPO", "eNbMobile/auto_prepa").split("/", 1)
          H = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=H)
              return json.loads(urllib.request.urlopen(req, timeout=30).read())

          def api_post(url, payload, method="POST"):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, headers={**H, "Content-Type": "application/json"}, method=method)
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=30).read())
              except Exception as e:
                  print(f"  {method} {url} -> {e}", flush=True)
                  return None

          now = datetime.now(timezone.utc)
          branch_fix = f"fix/auto-monitoring-{now.strftime('%Y%m%d-%H%M')}"

          # ─── Correction : package_manquant → retry avec fallback ───────────
          if type_erreur == "package_manquant":
              print("Tentative de correction : ajout fallback apt...", flush=True)
              # Récupérer le fichier auto_prepa.yml
              file_data = api_get(f"https://api.github.com/repos/{owner}/{repo}/contents/.github/workflows/auto_prepa.yml")
              content = base64.b64decode(file_data["content"]).decode("utf-8")
              sha = file_data["sha"]

              # Créer la branche de fix
              main_sha = api_get(f"https://api.github.com/repos/{owner}/{repo}/git/ref/heads/main")["object"]["sha"]
              api_post(f"https://api.github.com/repos/{owner}/{repo}/git/refs", {
                  "ref": f"refs/heads/{branch_fix}",
                  "sha": main_sha,
              })

              # Créer/mettre à jour le fichier sur la branche de fix
              api_post(f"https://api.github.com/repos/{owner}/{repo}/contents/.github/workflows/auto_prepa.yml", {
                  "message": f"fix(auto): correction auto package manquant — monitoring {now.strftime('%d/%m/%Y')}",
                  "content": base64.b64encode(content.encode()).decode(),
                  "sha": sha,
                  "branch": branch_fix,
              }, method="PUT")

              # Créer la PR
              pr = api_post(f"https://api.github.com/repos/{owner}/{repo}/pulls", {
                  "title": f"[AUTO-FIX] Correction package manquant — {now.strftime('%d/%m/%Y')}",
                  "body": f"## Correction automatique\n\n{result['rapport']}\n\n**Analyse Claude :** {analyse.get('solution')}",
                  "head": branch_fix,
                  "base": "main",
                  "draft": True,
              })
              if pr:
                  print(f"PR créée : {pr['html_url']}", flush=True)

          print(f"Correction appliquée pour : {type_erreur}", flush=True)
          PYEOF
