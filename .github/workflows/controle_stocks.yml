name: Contrôle Stocks

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date J-1 (JJ/MM/AAAA) — laisser vide pour hier"
        required: false
        type: string

concurrency:
  group: controle_stocks
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer poppler-utils avec cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils
          version: 1.0

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Télécharger stocks et lancer le contrôle
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
        run: |
          python3 bootstrap.py download_stocks.py
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          elif [ "$(date +%u)" -eq 1 ]; then
            # Lundi : on prend samedi (J-2) car le dimanche n'a pas de ventes
            DATE_ARG="--date $(date -d '2 days ago' +%d/%m/%Y)"
          fi
          python3 controle_stocks.py j1.xlsx j.xlsx $DATE_ARG --upload

      - name: Publier le CSV résultat en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-stocks-${{ github.run_id }}
          path: "controle_stocks_*.csv"
          if-no-files-found: warn

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
