name: Classement Paniers

# Classe les commandes Drive d'une période par tranche de montant, semaine par
# semaine (tableau dans le résumé du run).

on:
  workflow_dispatch:
    inputs:
      du:
        description: "Premier jour (JJ/MM/AAAA)"
        required: true
        type: string
      au:
        description: "Dernier jour (JJ/MM/AAAA)"
        required: true
        type: string

jobs:
  classement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer poppler-utils avec cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils
          version: 1.0

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Classer les commandes par tranche de montant
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
        run: python3 bootstrap.py classement_paniers.py --du "${{ inputs.du }}" --au "${{ inputs.au }}"

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
          fi
