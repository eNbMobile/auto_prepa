name: copier_visuels_drive

# Workflow ponctuel : copie les visuels produits déjà présents dans le
# bucket R2 « visuels » (cf. cloudflare/visuels-r2-worker) vers un dossier
# Drive, pour en avoir une sauvegarde hors Cloudflare.
#
# Les visuels sont téléchargés en parallèle depuis l'URL publique
# visuels.coopu.workers.dev (pas de limite de débit comme sur l'API de
# gestion Cloudflare), regroupés par lots dans des zips, puis chaque zip
# est envoyé sur Drive en upload reprenable ("resumable"). Un lot (zip)
# déjà présent sur Drive est sauté, ce qui permet de relancer le workflow
# sans tout retélécharger si un run s'arrête avant la fin.
#
# Secrets du dépôt :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (déjà utilisés pour déployer
#                                                 les workers Cloudflare ;
#                                                 ici uniquement pour lister
#                                                 les clés du bucket)
#   GOOGLE_TOKEN_JSON, DRIVE_CONFIG_FOLDER_ID    (déjà utilisés ailleurs)

on:
  workflow_dispatch:

concurrency:
  group: copier_visuels_drive
  cancel-in-progress: false

jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Copier les visuels R2 vers Drive
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import concurrent.futures as futures
          import json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request, zipfile

          TAILLE_LOT = 3000       # visuels par zip
          TELECHARGEMENTS_PARALLELES = 30

          # ── Auth Google (même mécanisme que collecte_ean.yml) ──────────────
          token_json = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()
          if not token_json:
              print("Pas de GOOGLE_TOKEN_JSON → skip")
              sys.exit(0)
          token = json.loads(token_json)

          def refresh_access_token():
              data = urllib.parse.urlencode({
                  "client_id":     token["client_id"],
                  "client_secret": token["client_secret"],
                  "refresh_token": token["refresh_token"],
                  "grant_type":    "refresh_token",
              }).encode()
              resp = json.loads(urllib.request.urlopen(
                  urllib.request.Request("https://oauth2.googleapis.com/token", data=data), timeout=30
              ).read())
              token["access_token"] = resp["access_token"]
              pathlib.Path(pathlib.Path.home() / ".auto_prepa_token.json").write_text(json.dumps(token))
              return resp["access_token"], resp.get("expires_in", 3600)

          access, expires_in = refresh_access_token()
          token_expiry = time.time() + expires_in - 300
          H = {"Authorization": f"Bearer {access}"}

          def ensure_fresh_token():
              global access, token_expiry
              if time.time() < token_expiry:
                  return
              access, expires_in = refresh_access_token()
              token_expiry = time.time() + expires_in - 300
              H["Authorization"] = f"Bearer {access}"
              print("  (token Google rafraîchi)")

          def _requete(url, headers, data=None, method=None, timeout=30, tentatives=3):
              derniere_erreur = None
              for essai in range(tentatives):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method=method)
                      return urllib.request.urlopen(req, timeout=timeout).read()
                  except urllib.error.HTTPError as e:
                      derniere_erreur = e
                      if e.code in (429, 500, 502, 503, 504) and essai < tentatives - 1:
                          time.sleep(2 * (essai + 1))
                          continue
                      raise
              raise derniere_erreur

          def drive_list(q, fields="files(id,name)", page_size=1000):
              fichiers, page_token = [], None
              while True:
                  params = {"q": q, "fields": f"nextPageToken,{fields}", "pageSize": str(page_size)}
                  if page_token:
                      params["pageToken"] = page_token
                  url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode(params)
                  r = json.loads(_requete(url, H))
                  fichiers.extend(r.get("files", []))
                  page_token = r.get("nextPageToken")
                  if not page_token:
                      break
              return fichiers

          def drive_resumable_upload(parent_id, name, local_path, mime="application/zip", taille_bloc=8 * 1024 * 1024):
              """Envoi reprenable (protocole resumable de l'API Drive) : adapté
              aux zips de plusieurs centaines de Mo, contrairement à l'upload
              multipart simple utilisé ailleurs pour les petits fichiers JSON."""
              taille = os.path.getsize(local_path)
              init = urllib.request.Request(
                  "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
                  data=json.dumps({"name": name, "parents": [parent_id]}).encode(),
                  headers={**H, "Content-Type": "application/json; charset=UTF-8",
                           "X-Upload-Content-Type": mime, "X-Upload-Content-Length": str(taille)},
                  method="POST")
              reponse = urllib.request.urlopen(init, timeout=60)
              session_url = reponse.headers.get("Location")
              resultat = None
              with open(local_path, "rb") as f:
                  octet = 0
                  while octet < taille:
                      morceau = f.read(taille_bloc)
                      fin = octet + len(morceau) - 1
                      req = urllib.request.Request(session_url, data=morceau, method="PUT", headers={
                          **H, "Content-Length": str(len(morceau)),
                          "Content-Range": f"bytes {octet}-{fin}/{taille}",
                      })
                      try:
                          r = urllib.request.urlopen(req, timeout=180)
                          resultat = json.loads(r.read())
                      except urllib.error.HTTPError as e:
                          if e.code != 308:   # 308 = bloc reçu, suite de l'envoi
                              raise
                      octet += len(morceau)
              return resultat

          # ── Dossier Drive de destination (config/visuels) ──────────────────
          config_id = os.environ.get("DRIVE_CONFIG_FOLDER_ID", "").strip()
          if not config_id:
              print("DRIVE_CONFIG_FOLDER_ID manquant → skip")
              sys.exit(0)

          dossiers = drive_list(
              f"name='visuels' and '{config_id}' in parents"
              " and mimeType='application/vnd.google-apps.folder' and trashed=false")
          if dossiers:
              visuels_folder_id = dossiers[0]["id"]
          else:
              r = json.loads(_requete(
                  "https://www.googleapis.com/drive/v3/files",
                  {**H, "Content-Type": "application/json"},
                  data=json.dumps({"name": "visuels", "mimeType": "application/vnd.google-apps.folder",
                                    "parents": [config_id]}).encode(), method="POST"))
              visuels_folder_id = r["id"]
              print(f"Dossier Drive 'visuels' créé : {visuels_folder_id}")

          print("Liste des lots déjà copiés sur Drive ...")
          deja_copies = {f["name"] for f in drive_list(f"'{visuels_folder_id}' in parents and trashed=false")}
          print(f"  {len(deja_copies)} lot(s) déjà présent(s) sur Drive (seront sautés)")

          # ── Liste des clés du bucket R2 (API de gestion Cloudflare) ────────
          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          cf_account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not cf_token or not cf_account:
              print("Secrets Cloudflare manquants (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) → skip")
              sys.exit(1)
          CF_H = {"Authorization": f"Bearer {cf_token}"}
          BUCKET = "visuels"

          def cf_list_objects():
              cles, cursor = [], None
              while True:
                  params = {"per_page": "1000"}
                  if cursor:
                      params["cursor"] = cursor
                  url = (f"https://api.cloudflare.com/client/v4/accounts/{cf_account}"
                         f"/r2/buckets/{BUCKET}/objects?" + urllib.parse.urlencode(params))
                  r = json.loads(_requete(url, CF_H))
                  if not r.get("success"):
                      print("  ERREUR listing R2 :", r.get("errors"))
                      break
                  cles.extend(obj["key"] for obj in r.get("result", []))
                  cursor = (r.get("result_info") or {}).get("cursor")
                  if not cursor:
                      break
              return cles

          # ── Téléchargement des visuels (URL publique, sans limite de débit
          #    comme celle de l'API de gestion Cloudflare) ────────────────────
          VISUELS_BASE = "https://visuels.coopu.workers.dev/"

          def telecharger_visuel(cle, tentatives=3):
              url = VISUELS_BASE + urllib.parse.quote(cle)
              derniere_erreur = None
              for essai in range(tentatives):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          return cle, r.read()
                  except Exception as e:
                      derniere_erreur = e
                      time.sleep(0.5 * (essai + 1))
              print(f"  Erreur téléchargement {cle} : {derniere_erreur}")
              return cle, None

          print("Listing des visuels sur R2 ...")
          cles = cf_list_objects()
          print(f"{len(cles)} visuels dans le bucket R2.")

          lots = [cles[i:i + TAILLE_LOT] for i in range(0, len(cles), TAILLE_LOT)]
          print(f"{len(lots)} lot(s) de {TAILLE_LOT} visuels maximum.")

          total_copies = total_erreurs = 0
          for num, lot in enumerate(lots, start=1):
              nom_zip = f"visuels_part{num:03d}.zip"
              if nom_zip in deja_copies:
                  print(f"Lot {num}/{len(lots)} ({nom_zip}) déjà sur Drive, ignoré.")
                  continue

              ensure_fresh_token()
              print(f"Lot {num}/{len(lots)} : téléchargement de {len(lot)} visuels ...")
              chemin_zip = f"/tmp/{nom_zip}"
              erreurs_lot = 0
              with zipfile.ZipFile(chemin_zip, "w", zipfile.ZIP_DEFLATED) as zf:
                  with futures.ThreadPoolExecutor(max_workers=TELECHARGEMENTS_PARALLELES) as pool:
                      for cle, contenu in pool.map(telecharger_visuel, lot):
                          if contenu is None:
                              erreurs_lot += 1
                              continue
                          zf.writestr(cle, contenu)

              taille_mo = os.path.getsize(chemin_zip) / (1024 * 1024)
              print(f"  Zip constitué ({taille_mo:.1f} Mo, {len(lot) - erreurs_lot} visuels), envoi vers Drive ...")
              ensure_fresh_token()
              try:
                  drive_resumable_upload(visuels_folder_id, nom_zip, chemin_zip)
                  total_copies += len(lot) - erreurs_lot
                  total_erreurs += erreurs_lot
                  print(f"  Lot {num} envoyé sur Drive.")
              except Exception as e:
                  print(f"  ERREUR envoi Drive {nom_zip} : {e}")
                  total_erreurs += len(lot) - erreurs_lot
              finally:
                  os.remove(chemin_zip)

          print(f"\nTerminé : {len(cles)} visuels sur R2 en {len(lots)} lot(s), "
                f"{total_copies} copiés ce run, {total_erreurs} erreur(s).")
          EOF

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
