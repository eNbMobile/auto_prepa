name: Rattrapage Jeudi Plus

# Lancement manuel : relève les produits Jeudi Plus des bons déjà générés pour
# un jour de retrait (défaut : demain) et réécrit le récapitulatif
# GITHUB/JeudiPlus/jeudi_plus_AAAA-MM-JJ.csv (cf. rattrapage_jeudi_plus.py).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date de retrait JJ/MM/AAAA (vide = demain)"
        required: false
        type: string
      dossier:
        description: "ID d'un autre dossier Drive de bon_prepa (facultatif : le dossier des bons et GITHUB/JeudiPlus/Bons_prepa sont toujours lus)"
        required: false
        type: string

concurrency:
  group: jeudi_plus
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Relever les bons déjà générés
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          BOOTSTRAP_LOCAL:        "1"
          DATE:                   ${{ inputs.date }}
          DOSSIER:                ${{ inputs.dossier }}
        run: python3 bootstrap.py rattrapage_jeudi_plus.py --date "$DATE" --dossier "$DOSSIER"

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
