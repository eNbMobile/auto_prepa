name: Deplacer commandes en attente

# Deplace chaque soir les BonDeCommande dont le deplacement a ete demande dans
# la journee (carte "Deplacer commandes" du tableau de bord, sans forcage) :
# la demande n'est inscrite, sur le moment, qu'en marqueur Drive
# GITHUB/DeplacementsEnAttente/ par deplacer_commande.py (mettre_en_attente),
# et c'est ce workflow qui effectue le deplacement physique une fois les
# ventes et le CA du jour deja calcules — sinon une commande deplacee d'un
# jour a l'autre disparaissait des ventes du jour alors qu'elle
# avait bien ete preparee. Traite aussi les suppressions demandees sans
# forcage (marqueur SUPPRIMER). Voir deplacer_commandes_attente.py.

on:
  schedule:
    - cron: '7 20 * * *'  # 22h07 Paris en heure d'ete (CEST = UTC+2)
    - cron: '7 21 * * *'  # 22h07 Paris en heure d'hiver (CET = UTC+1) - decale de l'heure ronde
                           # pour limiter le risque de declenchement 'schedule'
                           # saute par GitHub Actions en cas de forte charge
                           # (meme precaution que livraison_drive_en_attente.yml).
  workflow_dispatch:

concurrency:
  group: deplacer_commandes
  cancel-in-progress: false

jobs:
  # Deux horaires planifiés (heure d'été UTC+2 / heure d'hiver UTC+1) : le job
  # principal ne passe qu'à partir de 22h à Paris (jamais avant le calcul des
  # ventes et du CA du jour). En été le second passage (23h07) ne trouve plus
  # rien à déplacer ; un run retardé par GitHub après 22h passe quand même.
  heure:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.paris.outputs.ok }}
    steps:
      - id: paris
        run: |
          h=$(TZ=Europe/Paris date +%-H)
          echo "Heure de Paris : $h h"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$h" -ge 22 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  deplacer-en-attente:
    needs: heure
    if: needs.heure.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Déplacer les commandes en attente
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
        run: python3 deplacer_commandes_attente.py

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
