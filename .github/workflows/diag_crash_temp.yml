name: DIAG temporaire crash prepa_drive_degrade

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Restaurer le cache PDFs
        uses: actions/cache@v4
        with:
          path: pdf_cache
          key: pdf-cache-diag
          restore-keys: pdf-cache-

      - name: Installer pdftotext + gdb
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils gdb
          version: 1.0

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Diagnostic
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
        run: python3 diag_prepa_drive_degrade.py
