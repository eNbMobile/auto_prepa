name: Alerte consommation R2

# Une fois par jour : mail si une des 3 limites gratuites R2 (stockage 10 Go,
# 1 M opérations de classe A, 10 M de classe B) franchit 80 % sur le mois.
# Lancement manuel avec « tester » : envoie le récapitulatif même sous le seuil.
#
# Secrets : CLOUDFLARE_API_TOKEN (permission « Account Analytics : Read »),
# CLOUDFLARE_ACCOUNT_ID, GOOGLE_TOKEN_JSON, DRIVE_CONFIG_FOLDER_ID, GH_PAT.

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      tester:
        description: "Envoyer le récapitulatif même sous le seuil (test du mail)"
        required: false
        default: false
        type: boolean

concurrency:
  group: alerte_r2
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Vérifier la consommation R2
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          BOOTSTRAP_LOCAL: "1"
          WORK_DIR: "v 4.0.0"
          TESTER: ${{ inputs.tester }}
        run: |
          if [ "$TESTER" = "true" ]; then
            python3 bootstrap.py alerte_r2.py --tester
          else
            python3 bootstrap.py alerte_r2.py
          fi

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
          fi
