name: Adresses inconnues

# Chaque soir : PDF des produits restés sans adresse dans le chemin de
# préparation au cours de la journée (relevés par auto_prepa.py dans
# Drive GITHUB/AdressesInconnues/), envoyé par email pour être traité le
# lendemain matin. Un jour manqué est rattrapé au run suivant.
on:
  schedule:
    # 18h43 UTC = 20h43 (heure d'été) / 19h43 (heure d'hiver), minute non
    # ronde : les déclenchements 'schedule' à l'heure pile sont souvent
    # retardés ou sautés par GitHub.
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Envoyer jusqu'au (JJ/MM/AAAA) — laisser vide pour aujourd'hui"
        required: false
        type: string

concurrency:
  group: adresses_inconnues
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Générer et envoyer le PDF des produits non adressés
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          DATE_ARG:               ${{ inputs.date }}
        run: |
          if [ -n "$DATE_ARG" ]; then
            python3 bootstrap.py adresses_inconnues.py --date "$DATE_ARG"
          else
            python3 bootstrap.py adresses_inconnues.py
          fi

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
