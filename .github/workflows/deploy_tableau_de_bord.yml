name: Deployer tableau de bord Cloudflare

# Déploie les workers Cloudflare "wf" et "wf2" (même code,
# cloudflare/dashboard-worker/src/index.js) à chaque modification poussée sur
# main, pour que les pages en ligne ne restent plus en retard sur le dépôt.
#
# Secrets du dépôt nécessaires :
#   CLOUDFLARE_API_TOKEN   token Cloudflare, modèle « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
# Facultatif :
#   WF_GH_TOKEN            s'il est défini, (ré)installé comme secret GH_TOKEN
#                          des workers (sinon celui déjà en place est gardé)
#   GMAIL_PUSH_TOKEN       jeton de l'URL de l'abonnement Pub/Sub, installé
#                          comme secret PUBSUB_TOKEN du worker « gmailpush »
#
# Le worker « gmailpush » (cloudflare/gmail-push-worker) est déployé par le job
# du même nom : il lance aut_prep à chaque email reçu (voir son README).

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/dashboard-worker/**'
      - 'cloudflare/dashboard2-worker/**'
      - 'cloudflare/gmail-push-worker/**'
      - '.github/workflows/deploy_tableau_de_bord.yml'
  workflow_dispatch:

concurrency:
  group: deploy_tableau_de_bord
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AVEC_GH_TOKEN: ${{ secrets.WF_GH_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        dossier: [dashboard-worker, dashboard2-worker]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les secrets Cloudflare
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents du dépôt : déploiement impossible."
            exit 1
          fi

      - name: Déployer (avec secret GH_TOKEN)
        if: env.AVEC_GH_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          GH_TOKEN: ${{ secrets.WF_GH_TOKEN }}
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/${{ matrix.dossier }}
          secrets: |
            GH_TOKEN

      - name: Déployer
        if: env.AVEC_GH_TOKEN != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/${{ matrix.dossier }}

  gmailpush:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer le worker gmailpush et ses secrets
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN:              ${{ secrets.WF_GH_TOKEN }}
          PUBSUB_TOKEN:          ${{ secrets.GMAIL_PUSH_TOKEN }}
        working-directory: cloudflare/gmail-push-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID absents du dépôt."
            exit 1
          fi
          npx --yes wrangler@3.114.0 deploy
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | npx --yes wrangler@3.114.0 secret put GH_TOKEN
          fi
          if [ -n "$PUBSUB_TOKEN" ]; then
            printf '%s' "$PUBSUB_TOKEN" | npx --yes wrangler@3.114.0 secret put PUBSUB_TOKEN
          else
            echo "::warning::Secret GMAIL_PUSH_TOKEN absent : le worker refusera les notifications Pub/Sub tant qu'il n'est pas défini."
          fi
