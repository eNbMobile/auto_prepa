name: Deployer visuels

# Publie les visuels produits sur https://visuels.coopu.workers.dev/<gencod>.png
# (lus par anticipation_commandes.py). Les images viennent de visuels.zip
# déposé sur Drive (n'importe quel dossier) : pour ajouter des visuels,
# remplacer visuels.zip puis relancer ce workflow.
#
# Secrets : GOOGLE_TOKEN_JSON, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: deploy_visuels
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_anticipation.txt

      - name: Installer les dépendances pip
        run: pip install -r requirements_anticipation.txt

      - name: Télécharger visuels.zip depuis Drive
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python3 - <<'PY'
          import io, os, sys, zipfile
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import auto_prepa as ap

          svc = build("drive", "v3", credentials=ap.get_credentials())
          res = svc.files().list(
              q="name='visuels.zip' and trashed=false",
              orderBy="modifiedTime desc", fields="files(id,modifiedTime)").execute()
          fichiers = res.get("files", [])
          if not fichiers:
              sys.exit("visuels.zip introuvable sur Drive")
          buf = io.BytesIO()
          dl = MediaIoBaseDownload(buf, svc.files().get_media(fileId=fichiers[0]["id"]))
          fini = False
          while not fini:
              _, fini = dl.next_chunk()
          dest = "cloudflare/visuels-worker/public"
          os.makedirs(dest, exist_ok=True)
          n = 0
          with zipfile.ZipFile(buf) as z:
              for info in z.infolist():
                  nom = os.path.basename(info.filename)
                  if info.is_dir() or not nom.lower().endswith((".png", ".jpg")):
                      continue
                  with open(os.path.join(dest, nom), "wb") as f:
                      f.write(z.read(info))
                  n += 1
          print(f"{n} visuel(s) extrait(s)")
          if n == 0:
              sys.exit("Aucun visuel .png/.jpg dans visuels.zip")
          PY

      - name: Déployer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/visuels-worker
