name: Deployer visuels

# Publie les visuels produits sur https://visuels.coopu.workers.dev/<gencod>.png
# (lus par anticipation_commandes.py). Les images sont récupérées en FTP sur
# l'hébergement Plesk (/httpdocs/mobUDrive/visuels) : pour ajouter des
# visuels, les déposer là puis relancer ce workflow.
#
# Secrets : FTP_HOST, FTP_USER, FTP_PASSWORD, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: deploy_visuels
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer les visuels en FTP (Plesk)
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secrets FTP_HOST, FTP_USER et/ou FTP_PASSWORD absents du dépôt."
            exit 1
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          dest=cloudflare/visuels-worker/public
          mkdir -p "$dest"
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --parallel=10 --no-perms --verbose=0 --include-glob '*.png' --include-glob '*.jpg' /httpdocs/mobUDrive/visuels $dest;
            quit"
          n=$(find "$dest" -maxdepth 1 -type f | wc -l)
          echo "$n visuel(s) récupéré(s)"
          [ "$n" -gt 0 ] || { echo "::error::Aucun visuel récupéré"; exit 1; }

      - name: Déployer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/visuels-worker
