name: Deployer visuels

# Publie les visuels produits sur https://visuels-<n>.coopu.workers.dev/<gencod>.png
# (lus par anticipation_commandes.py). Les images sont récupérées en FTP sur
# l'hébergement Plesk (/httpdocs/mobUDrive/visuels) : pour ajouter des
# visuels, les déposer là puis relancer ce workflow. Le téléchargement
# s'arrête à 45 min et reprend au run suivant (cache).
#
# Secrets : FTP_HOST, FTP_USER, FTP_PASSWORD, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: deploy_visuels
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Les visuels déjà récupérés sont gardés en cache d'un run à l'autre :
      # un run interrompu reprend là où le précédent s'est arrêté.
      - name: Restaurer les visuels déjà récupérés
        uses: actions/cache/restore@v4
        with:
          path: cloudflare/visuels-worker/public
          key: visuels-${{ github.run_id }}
          restore-keys: visuels-

      - name: Récupérer les visuels en FTP (Plesk)
        id: ftp
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secrets FTP_HOST, FTP_USER et/ou FTP_PASSWORD absents du dépôt."
            exit 1
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          dest=cloudflare/visuels-worker/public
          mkdir -p "$dest"
          echo "Déjà en cache : $(find "$dest" -maxdepth 1 -type f | wc -l) visuel(s)"
          # Compteur toutes les 30 s pendant le téléchargement
          ( while sleep 30; do
              echo "$(date -u +%H:%M:%S) : $(find "$dest" -maxdepth 1 -type f | wc -l) visuel(s) récupéré(s)"
            done ) &
          compteur=$!
          export LFTP_PASSWORD="$FTP_PASSWORD"
          # Diagnostic de connexion : port joignable, puis test lftp limité à
          # 60 s dont on n'affiche que les messages d'erreur (ni IP ni chemin).
          if timeout 15 bash -c "exec 3<>/dev/tcp/$FTP_HOST/21" 2>/dev/null; then
            echo "Port 21 joignable"
          else
            echo "::warning::Port 21 injoignable sur FTP_HOST"
          fi
          set +e
          sortie=$(timeout 60 lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 1;
            set net:timeout 20;
            cls -1 /httpdocs/mobUDrive/visuels | head -n 3;
            quit" 2>&1)
          echo "Test de connexion lftp : code $?"
          set -e
          # Seulement les messages d'erreur, sans IP ni chemin du compte
          echo "$sortie" | grep -iE 'error|fatal|fail|denied|refused|timeout|ssl|tls|login|[0-9]{3} ' \
            | grep -viE 'vhosts|subject|issuer' \
            | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<ip>/g' | head -n 10 || true
          echo "Premiers visuels listés : $(echo "$sortie" | grep -cE '\.png$')"
          # Arrêt volontaire à 45 min : on publie et on met en cache ce qui
          # est récupéré ; le run suivant continue (fichiers existants ignorés).
          set +e
          timeout 45m lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            set xfer:use-temp-file true;
            mirror --only-missing --parallel=10 --no-perms --verbose=0 --include-glob '*.png' /httpdocs/mobUDrive/visuels $dest;
            quit"
          code=$?
          set -e
          kill $compteur 2>/dev/null || true
          # Fichiers partiels (temporaires .in.*) laissés par l'interruption
          find "$dest" -maxdepth 1 -type f \( -name '.in.*' -o -size 0 \) -delete
          n=$(find "$dest" -maxdepth 1 -type f | wc -l)
          echo "Total : $n visuel(s) récupéré(s)"
          if [ "$code" = 124 ]; then
            echo "::warning::Téléchargement interrompu à 45 min ($n visuels) : relancer le workflow pour récupérer la suite."
          elif [ "$code" != 0 ]; then
            echo "::warning::lftp a terminé avec le code $code ($n visuels récupérés)."
          fi
          [ "$n" -gt 0 ] || { echo "::error::Aucun visuel récupéré"; exit 1; }

      - name: Mettre en cache les visuels récupérés
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloudflare/visuels-worker/public
          key: visuels-${{ github.run_id }}

      # Limite gratuite Cloudflare : 20 000 fichiers par worker. Les visuels
      # sont répartis sur 2 workers visuels-0..1 selon gencod % 2 (même règle
      # que _url_visuel dans anticipation_commandes.py et l'appli MobUDrive).
      - name: Répartir les visuels sur les workers
        run: |
          python3 - <<'PY'
          import os, re, sys
          NB = 2
          src = "cloudflare/visuels-worker/public"
          base = "cloudflare/visuels-worker/workers"
          compte = [0] * NB
          for i in range(NB):
              d = f"{base}/visuels-{i}"
              os.makedirs(f"{d}/public", exist_ok=True)
              with open(f"{d}/wrangler.toml", "w") as f:
                  f.write(f'name = "visuels-{i}"\ncompatibility_date = "2024-11-01"\n\n'
                          '[assets]\ndirectory = "./public"\nnot_found_handling = "none"\n')
          for nom in os.listdir(src):
              chiffres = re.sub(r"\D", "", os.path.splitext(nom)[0])
              n = int(chiffres) % NB if chiffres else 0
              os.link(f"{src}/{nom}", f"{base}/visuels-{n}/public/{nom}")
              compte[n] += 1
          for i, c in enumerate(compte):
              print(f"visuels-{i} : {c} visuel(s)")
          if max(compte) > 20000:
              sys.exit("Un worker dépasse 20 000 visuels : augmenter NB (ici et dans anticipation_commandes.py)")
          PY

      - name: Déployer
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for d in cloudflare/visuels-worker/workers/visuels-*; do
            echo "Déploiement de $(basename "$d")"
            (cd "$d" && npx --yes wrangler@4 deploy)
          done
          # Workers visuels-N devenus inutiles (si NB a été réduit)
          nb=$(ls -d cloudflare/visuels-worker/workers/visuels-* | wc -l)
          for i in $(seq "$nb" 9); do
            npx --yes wrangler@4 delete --name "visuels-$i" --force > /dev/null 2>&1 \
              && echo "Worker visuels-$i supprimé" || true
          done
