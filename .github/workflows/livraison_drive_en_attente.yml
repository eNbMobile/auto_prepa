name: Livraison Drive - En attente

on:
  schedule:
    - cron: '3 13 * * 1-6'  # 15h03 Paris en heure d'ete (CEST = UTC+2)
    - cron: '3 14 * * 1-6'  # 15h03 Paris en heure d'hiver (CET = UTC+1) ; du lundi au samedi, decale de
                            # l'heure ronde pour limiter le risque de declenchement
                            # 'schedule' saute par GitHub Actions en cas de forte charge
                            # (cf. garde-fou dans auto_prepa.py :
                            # promotion_en_attente_necessaire). Pas de run le dimanche :
                            # les commandes EN ATTENTE visant le lundi sont deja
                            # remontees par le run du samedi 15h (_lendemain_ouvre(samedi)
                            # = lundi), donc rien n'est jamais en attente pour le
                            # dimanche.
  workflow_dispatch:

concurrency:
  group: livraison_drive_en_attente
  cancel-in-progress: false

jobs:
  # Deux horaires planifiés (heure d'été UTC+2 / heure d'hiver UTC+1) : seul
  # celui qui tombe à 15h à Paris laisse passer le job principal.
  heure:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.paris.outputs.ok }}
    steps:
      - id: paris
        run: |
          h=$(TZ=Europe/Paris date +%-H)
          echo "Heure de Paris : $h h"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$h" = "15" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  en-attente:
    needs: heure
    if: needs.heure.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Renseigner les commandes LIVRAISON du lendemain
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
        run: python3 bootstrap.py livraison_drive.py

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
