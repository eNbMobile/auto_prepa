name: Livraison Drive - En attente

on:
  schedule:
    - cron: '3 12 * * *'   # 14h03 Paris (CEST = UTC+2) - decale de l'heure ronde pour
                            # limiter le risque de declenchement 'schedule' saute par
                            # GitHub Actions en cas de forte charge (cf. garde-fou dans
                            # auto_prepa.py : promotion_en_attente_necessaire)
  workflow_dispatch:

concurrency:
  group: livraison_drive_en_attente
  cancel-in-progress: false

jobs:
  en-attente:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Renseigner les commandes LIVRAISON du lendemain
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
        run: python3 bootstrap.py livraison_drive.py

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
