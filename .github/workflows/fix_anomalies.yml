name: fix_anomalies

on:
  schedule:
    - cron: '0 21 * * *'   # 23h00 Paris (heure d'été CEST = UTC+2)
  workflow_dispatch:

jobs:
  fix-anomalies:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Corriger les bons invalides
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
        run: python3 bootstrap.py fix_anomalies.py

      - name: Corriger les anomalies de point-virgules dans les bons de prépa
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
        run: |
          python3 - <<'PYEOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          import controle_stocks as cs

          print("=== Correction point-virgules bons de prépa ===")
          cs._charger_config()
          resultats = cs.corriger_bons_prepa_drive()
          if resultats:
              total = sum(r[1] for r in resultats)
              print(f"\n{total} correction(s) appliquée(s) sur {len(resultats)} fichier(s).")
              cs.envoyer_email_corrections_bon_prepa(resultats)
          else:
              print("Aucune anomalie de point-virgule détectée.")
          PYEOF

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.fix_anomalies_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
