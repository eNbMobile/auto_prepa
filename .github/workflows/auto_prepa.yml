name: Auto Prépa Drive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-prepa:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier nouveaux emails Gmail
        id: check_pdfs
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.parse

          token_json = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()
          if not token_json:
              print("Pas de token → skip")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("has_new=false\n")
              sys.exit(0)

          token = json.loads(token_json)
          data = urllib.parse.urlencode({
              "client_id":     token["client_id"],
              "client_secret": token["client_secret"],
              "refresh_token": token["refresh_token"],
              "grant_type":    "refresh_token"
          }).encode()
          resp = json.loads(urllib.request.urlopen(
              urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
          ).read())
          access = resp["access_token"]
          headers = {"Authorization": f"Bearer {access}"}

          # Vérifier s'il y a des emails non traités (confirmations ou modifications)
          queries = [
              'from:no-reply@systeme-u.fr subject:"Confirmation commande" -label:BDC_Conf_Traites',
              'subject:"Modification par le client de la commande" -label:BDC_Modif_Traites',
              'subject:"Alerte annulation" -label:BDC_Modif_Traites',
          ]
          has_new = False
          for q in queries:
              url = "https://gmail.googleapis.com/gmail/v1/users/me/messages?" + urllib.parse.urlencode({
                  "q": q,
                  "maxResults": "1",
              })
              try:
                  res = json.loads(urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers)
                  ).read())
                  if res.get("messages"):
                      has_new = True
                      break
              except Exception as e:
                  print(f"Erreur Gmail : {e}")
                  has_new = True  # En cas d'erreur, lancer quand même
                  break

          result = "true" if has_new else "false"
          print(f"Emails non traités détectés → continuer={result}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"has_new={result}\n")
          EOF

      - name: Restaurer le cache PDFs
        if: steps.check_pdfs.outputs.has_new == 'true'
        uses: actions/cache@v4
        with:
          path: pdf_cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Rendre le binaire exécutable
        if: steps.check_pdfs.outputs.has_new == 'true'
        run: chmod +x "v 4.0.0/prepa_drive_degrade"

      - name: Installer pdftotext (poppler-utils)
        if: steps.check_pdfs.outputs.has_new == 'true'
        run: sudo apt-get install -y poppler-utils

      - name: Installer Python et dépendances
        if: steps.check_pdfs.outputs.has_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        if: steps.check_pdfs.outputs.has_new == 'true'
        run: pip install -r requirements.txt

      - name: Exécuter auto_prepa.py
        if: steps.check_pdfs.outputs.has_new == 'true'
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python3 auto_prepa.py

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        if: steps.check_pdfs.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
