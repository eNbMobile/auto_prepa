name: Auto Prépa Drive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # déclenchement manuel depuis l'interface GitHub

jobs:
  auto-prepa:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Restaurer le cache PDFs
        uses: actions/cache@v4
        with:
          path: pdf_cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Cache exécutable C++ (recompile si sources changent)
        id: cache-bin
        uses: actions/cache@v4
        with:
          path: "v 3.0x/v 3.7.4/prepa_drive_degrade"
          key: cpp-bin-${{ hashFiles('v 3.0x/v 3.7.4/Programmes/*.c') }}

      - name: Compiler prepa_drive_degrade (si pas en cache)
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y gcc
          gcc -o "v 3.0x/v 3.7.4/prepa_drive_degrade" \
              "v 3.0x/v 3.7.4/Programmes/prepa_drive_degrade.c" \
              "v 3.0x/v 3.7.4/Programmes/fct_prepa_drive_degrade.c" -lm

      - name: Installer pdftotext (poppler-utils)
        run: sudo apt-get install -y poppler-utils

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Exécuter auto_prepa.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 auto_prepa.py
