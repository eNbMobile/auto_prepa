name: Auto Prépa Drive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-prepa:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier nouveaux PDFs sur Drive
        id: check_pdfs
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.parse

          token_json = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()
          if not token_json:
              print("Pas de token → skip")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("has_new=false\n")
              sys.exit(0)

          token = json.loads(token_json)
          data = urllib.parse.urlencode({
              "client_id":     token["client_id"],
              "client_secret": token["client_secret"],
              "refresh_token": token["refresh_token"],
              "grant_type":    "refresh_token"
          }).encode()
          resp = json.loads(urllib.request.urlopen(
              urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
          ).read())
          access = resp["access_token"]

          url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode({
              "q": "name contains 'BonDeCommande' and trashed=false",
              "fields": "files(name)",
              "pageSize": "50",
              "includeItemsFromAllDrives": "true",
              "supportsAllDrives": "true",
          })
          files = json.loads(urllib.request.urlopen(
              urllib.request.Request(url, headers={"Authorization": f"Bearer {access}"})
          ).read()).get("files", [])

          result = "true" if files else "false"
          print(f"{len(files)} BonDeCommande(s) détecté(s) → continuer={result}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"has_new={result}\n")
          EOF

      - name: Restaurer le cache PDFs
        if: steps.check_pdfs.outputs.has_new == 'true'
        uses: actions/cache@v4
        with:
          path: pdf_cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Cache exécutable C++ (recompile si sources changent)
        if: steps.check_pdfs.outputs.has_new == 'true'
        id: cache-bin
        uses: actions/cache@v4
        with:
          path: "v 3.0x/v 3.7.4/prepa_drive_degrade"
          key: cpp-bin-${{ hashFiles('v 3.0x/v 3.7.4/Programmes/*.c') }}

      - name: Compiler prepa_drive_degrade (si pas en cache)
        if: steps.check_pdfs.outputs.has_new == 'true' && steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y gcc
          gcc -o "v 3.0x/v 3.7.4/prepa_drive_degrade" \
              "v 3.0x/v 3.7.4/Programmes/prepa_drive_degrade.c" \
              "v 3.0x/v 3.7.4/Programmes/fct_prepa_drive_degrade.c" -lm

      - name: Installer pdftotext (poppler-utils)
        if: steps.check_pdfs.outputs.has_new == 'true'
        run: sudo apt-get install -y poppler-utils

      - name: Installer Python et dépendances
        if: steps.check_pdfs.outputs.has_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        if: steps.check_pdfs.outputs.has_new == 'true'
        run: pip install -r requirements.txt

      - name: Exécuter auto_prepa.py
        if: steps.check_pdfs.outputs.has_new == 'true'
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python3 auto_prepa.py

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        if: steps.check_pdfs.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
