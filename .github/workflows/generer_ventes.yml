name: Générer Ventes

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date (JJ/MM/AAAA) — laisser vide pour aujourd'hui"
        required: false
        type: string

concurrency:
  group: generer_ventes
  cancel-in-progress: false

jobs:
  ventes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer poppler-utils avec cache
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils
          version: 1.0

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Générer les ventes
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          python3 bootstrap.py generer_ventes.py $DATE_ARG

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
          fi

      # Cas non couvert par l'alerte email de generer_ventes.py (celle-ci ne
      # peut pas s'exécuter) : le run est annulé avant même de lancer le
      # script, par ex. si un autre déclenchement est arrivé entre-temps dans
      # le même groupe de concurrence.
      - name: Annotation si run annulé
        if: cancelled()
        run: echo "::error::Générer Ventes annulé avant exécution (concurrence ? relancer le jour concerné)."
