name: collecte_ean

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes
  workflow_dispatch:

concurrency:
  group: collecte_ean
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer poppler-utils (avec cache)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils
          version: 1.0

      - name: Installer les dépendances Python
        run: pip install pdfplumber google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Collecter les EAN depuis Drive BDC
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          BDC_FOLDER_ID:          ${{ secrets.BDC_FOLDER_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, tempfile, time, urllib.parse, urllib.request

          # ── Auth ──────────────────────────────────────────────────────────
          token_json = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()
          if not token_json:
              print("Pas de GOOGLE_TOKEN_JSON → skip")
              sys.exit(0)

          token = json.loads(token_json)
          import pathlib

          def refresh_access_token():
              """Rafraîchit le token OAuth et le persiste sur disque. Le token d'accès
              Google n'est valable qu'environ 1h ; comme la collecte peut traiter des
              centaines de PDF et dépasser cette durée, on doit pouvoir le renouveler
              en cours de route plutôt qu'une seule fois au démarrage."""
              data = urllib.parse.urlencode({
                  "client_id":     token["client_id"],
                  "client_secret": token["client_secret"],
                  "refresh_token": token["refresh_token"],
                  "grant_type":    "refresh_token",
              }).encode()
              resp = json.loads(urllib.request.urlopen(
                  urllib.request.Request("https://oauth2.googleapis.com/token", data=data), timeout=30
              ).read())
              token["access_token"] = resp["access_token"]
              pathlib.Path(pathlib.Path.home() / ".auto_prepa_token.json").write_text(json.dumps(token))
              return resp["access_token"], resp.get("expires_in", 3600)

          access, expires_in = refresh_access_token()
          token_expiry = time.time() + expires_in - 300  # marge de 5 min avant expiration réelle

          H = {"Authorization": f"Bearer {access}"}

          def ensure_fresh_token():
              """À appeler régulièrement pendant les longues boucles : renouvelle le
              token juste avant qu'il n'expire pour éviter les 401 en plein traitement."""
              global access, token_expiry
              if time.time() < token_expiry:
                  return
              access, expires_in = refresh_access_token()
              token_expiry = time.time() + expires_in - 300
              H["Authorization"] = f"Bearer {access}"
              print("  (token Google rafraîchi)")

          def drive_list(q, fields="files(id,name,mimeType,createdTime)"):
              url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode(
                  {"q": q, "fields": fields, "pageSize": "200"})
              return json.loads(urllib.request.urlopen(
                  urllib.request.Request(url, headers=H), timeout=30).read()).get("files", [])

          def drive_download(file_id):
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}?alt=media"
              return urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30).read()

          def drive_upload_or_update(parent_id, name, content_bytes, mime="application/json"):
              """Crée ou met à jour un fichier dans un dossier Drive."""
              # Chercher un fichier existant
              q = urllib.parse.quote(
                  f"name='{name}' and '{parent_id}' in parents and trashed=false")
              existing = json.loads(urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://www.googleapis.com/drive/v3/files?q={q}&fields=files(id)",
                      headers=H), timeout=30).read()).get("files", [])

              import io
              boundary = "------FormBoundary7MA4YWxkTrZu0gW"
              meta = json.dumps({"name": name, "parents": [parent_id]} if not existing else {"name": name})
              body = (
                  f"--{boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"
                  + meta + f"\r\n--{boundary}\r\nContent-Type: {mime}\r\n\r\n"
              ).encode() + content_bytes + f"\r\n--{boundary}--".encode()

              if existing:
                  url = f"https://www.googleapis.com/upload/drive/v3/files/{existing[0]['id']}?uploadType=multipart"
                  method = "PATCH"
              else:
                  url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart"
                  method = "POST"

              req = urllib.request.Request(url, data=body, headers={
                  **H, "Content-Type": f"multipart/related; boundary={boundary}",
              }, method=method)
              return json.loads(urllib.request.urlopen(req, timeout=30).read())

          # ── Trouver le dossier data/ dans DRIVE_CONFIG_FOLDER_ID ──────────
          config_id = os.environ.get("DRIVE_CONFIG_FOLDER_ID", "").strip()
          if not config_id:
              print("DRIVE_CONFIG_FOLDER_ID manquant → skip")
              sys.exit(0)

          data_folders = drive_list(
              f"name='data' and '{config_id}' in parents"
              " and mimeType='application/vnd.google-apps.folder' and trashed=false"
          )
          if not data_folders:
              # Créer le dossier data/
              r = json.loads(urllib.request.urlopen(urllib.request.Request(
                  "https://www.googleapis.com/drive/v3/files",
                  data=json.dumps({"name": "data", "mimeType": "application/vnd.google-apps.folder",
                                   "parents": [config_id]}).encode(),
                  headers={**H, "Content-Type": "application/json"}, method="POST",
              ), timeout=30).read())
              data_folder_id = r["id"]
              print(f"Dossier data/ créé : {data_folder_id}")
          else:
              data_folder_id = data_folders[0]["id"]

          # ── Charger l'état existant ───────────────────────────────────────
          def load_json_from_drive(folder_id, filename):
              q = urllib.parse.quote(
                  f"name='{filename}' and '{folder_id}' in parents and trashed=false")
              files = json.loads(urllib.request.urlopen(urllib.request.Request(
                  f"https://www.googleapis.com/drive/v3/files?q={q}&fields=files(id)",
                  headers=H), timeout=30).read()).get("files", [])
              if not files:
                  return None
              return json.loads(drive_download(files[0]["id"]))

          visuels_ean   = load_json_from_drive(data_folder_id, "visuels_ean.json") or []
          traites       = set((load_json_from_drive(data_folder_id, "fichiers_traites.json") or []))
          eans_existants = {e["ean"] for e in visuels_ean}

          print(f"État Drive : {len(visuels_ean)} EAN, {len(traites)} fichiers traités")

          # ── Trouver le dossier BDC racine ─────────────────────────────────
          bdc_root_id = os.environ.get("BDC_FOLDER_ID", "").strip()
          if not bdc_root_id:
              # Chercher par nom dans tout Drive
              res = drive_list(
                  "name='BDC' and mimeType='application/vnd.google-apps.folder' and trashed=false")
              if not res:
                  print("Dossier BDC introuvable — ajoutez le secret BDC_FOLDER_ID")
                  sys.exit(0)
              bdc_root_id = res[0]["id"]
              print(f"Dossier BDC trouvé automatiquement : {bdc_root_id}")

          # ── EAN-13 : validation par clé de contrôle ───────────────────────
          def valider_ean13(code):
              if len(code) != 13 or not code.isdigit():
                  return False
              total = sum(int(d) * (1 if i % 2 == 0 else 3) for i, d in enumerate(code[:12]))
              return (10 - total % 10) % 10 == int(code[12])

          def extraire_eans(texte):
              candidats = re.findall(r"\b\d{13}\b", texte)
              candidats += [re.sub(r"[\s\-]", "", c)
                            for c in re.findall(r"\b\d{3}[\s\-]\d{4}[\s\-]\d{6}\b", texte)]
              return [c for c in candidats if valider_ean13(c)]

          # ── Parcourir BDC/MM_AAAA/JJ_MM ──────────────────────────────────
          import pdfplumber, io as _io

          nouveaux_eans = []
          eans_sauvegardes = len(visuels_ean)
          traites_sauvegardes = len(traites)

          def sauvegarder_etat():
              """Persiste l'état sur Drive. Appelée après chaque dossier jour ET dans
              un finally, pour qu'un crash (401, PDF corrompu, etc.) en cours de route
              ne fasse jamais perdre le travail déjà accompli lors de ce run."""
              global eans_sauvegardes, traites_sauvegardes
              ensure_fresh_token()
              if len(visuels_ean) > eans_sauvegardes:
                  drive_upload_or_update(data_folder_id, "visuels_ean.json",
                                         json.dumps(visuels_ean, ensure_ascii=False, indent=2).encode())
                  eans_sauvegardes = len(visuels_ean)
                  print(f"  visuels_ean.json mis à jour sur Drive ({len(visuels_ean)} EAN)")
              if len(traites) > traites_sauvegardes:
                  drive_upload_or_update(data_folder_id, "fichiers_traites.json",
                                         json.dumps(list(traites)).encode())
                  traites_sauvegardes = len(traites)
                  print(f"  fichiers_traites.json mis à jour sur Drive ({len(traites)} entrées)")

          try:
              mois_dossiers = drive_list(
                  f"'{bdc_root_id}' in parents"
                  " and mimeType='application/vnd.google-apps.folder' and trashed=false")

              for mois in mois_dossiers:
                  ensure_fresh_token()
                  jours_dossiers = drive_list(
                      f"'{mois['id']}' in parents"
                      " and mimeType='application/vnd.google-apps.folder' and trashed=false")
                  for jour in jours_dossiers:
                      ensure_fresh_token()
                      pdfs = drive_list(
                          f"'{jour['id']}' in parents"
                          " and mimeType='application/pdf'"
                          " and name contains 'BonDeCommande' and trashed=false")
                      for pdf in pdfs:
                          if pdf["id"] in traites:
                              continue
                          ensure_fresh_token()
                          print(f"  {mois['name']}/{jour['name']}/{pdf['name']}")
                          m = re.search(r"BonDeCommande_(\w+)\.pdf", pdf["name"], re.IGNORECASE)
                          bdc_num = m.group(1) if m else pdf["name"]
                          try:
                              raw = drive_download(pdf["id"])
                              with pdfplumber.open(_io.BytesIO(raw)) as doc:
                                  texte = "\n".join(p.extract_text() or "" for p in doc.pages)
                              eans = extraire_eans(texte)
                              for ean in eans:
                                  if ean not in eans_existants:
                                      visuels_ean.append({
                                          "ean": ean,
                                          "bdc_numero": bdc_num,
                                          "date_bdc": f"{jour['name']}/{mois['name']}",
                                          "drive_file_id": pdf["id"],
                                      })
                                      eans_existants.add(ean)
                                      nouveaux_eans.append(ean)
                              print(f"    → {len(eans)} EAN trouvé(s)")
                              traites.add(pdf["id"])
                          except Exception as e:
                              print(f"    Erreur : {e}")
                      # Sauvegarde incrémentale après chaque dossier jour, pour ne
                      # jamais retraiter tout le backlog depuis zéro à cause d'un
                      # crash tardif (ex: token expiré au bout d'1h sur un gros run).
                      sauvegarder_etat()
          finally:
              sauvegarder_etat()

          print(f"\nNouveaux EAN : {len(nouveaux_eans)}")
          EOF

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
