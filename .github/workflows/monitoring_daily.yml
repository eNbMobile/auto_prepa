name: Monitoring Quotidien aut_prep

on:
  schedule:
    - cron: '0 8 * * *'   # 10h00 Paris (CEST UTC+2) / 9h00 (CET UTC+1)
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Analyser les runs des 24 dernières heures
        id: analyse
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          since_dt = datetime.now(timezone.utc) - timedelta(hours=24)
          since    = since_dt.strftime("%Y-%m-%dT%H:%M:%SZ")
          date_label = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Paginer les runs du workflow auto_prepa.yml (1 run/min = ~1440/jour)
          all_runs = []
          page = 1
          while page <= 20:  # max 2 000 runs
              params = urllib.parse.urlencode({"per_page": 100, "page": page})
              url = (f"https://api.github.com/repos/{repo}/actions/"
                     f"workflows/auto_prepa.yml/runs?{params}")
              data = json.loads(
                  urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers)
                  ).read()
              )
              runs = data.get("workflow_runs", [])
              if not runs:
                  break
              in_window = [r for r in runs if r["created_at"] >= since]
              all_runs.extend(in_window)
              if len(in_window) < len(runs):
                  break
              page += 1

          total      = len(all_runs)
          failures   = [r for r in all_runs if r["conclusion"] in ("failure", "cancelled", "timed_out")]
          successes  = [r for r in all_runs if r["conclusion"] == "success"]
          skipped    = [r for r in all_runs if r["conclusion"] == "skipped"]
          in_prog    = [r for r in all_runs if r["status"] in ("queued", "in_progress")]

          status_emoji = "✅" if not failures else "❌"

          # --- Rapport Markdown ---
          lines = [
              f"## {status_emoji} Rapport Monitoring aut_prep — {date_label}",
              "",
              f"**Période analysée** : dernières 24h (depuis `{since}` UTC)",
              "",
              "| Statut | Nombre |",
              "|--------|-------:|",
              f"| ✅ Succès | {len(successes)} |",
              f"| ❌ Erreurs | {len(failures)} |",
              f"| ⏭️ Ignorés (aucun email à traiter) | {len(skipped)} |",
              f"| ⏳ En cours | {len(in_prog)} |",
              f"| **Total** | **{total}** |",
              "",
          ]

          if failures:
              lines += [
                  "### ❌ Exécutions en erreur",
                  "",
              ]
              for r in failures[:20]:
                  lines.append(
                      f"- **Run #{r['run_number']}** — "
                      f"`{r['created_at']}` — "
                      f"`{r['conclusion']}` — "
                      f"[Voir les logs]({r['html_url']})"
                  )
              if len(failures) > 20:
                  lines.append(f"- … et {len(failures) - 20} autres erreurs")
              lines += [
                  "",
                  "⚠️ _Investigation et corrections requises._",
              ]
          else:
              lines += [
                  "### ✅ Toutes les exécutions se sont déroulées normalement.",
                  "",
              ]
              if successes:
                  last = successes[0]
                  lines.append(
                      f"Dernière exécution réussie : "
                      f"`{last['created_at']}` — "
                      f"[Run #{last['run_number']}]({last['html_url']})"
                  )

          report = "\n".join(lines)
          print(report)

          with open("/tmp/report.md", "w") as f:
              f.write(report)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_failures={'true' if failures else 'false'}\n")
              f.write(f"status_emoji={status_emoji}\n")
              f.write(f"date={date_label}\n")
              f.write(f"fail_count={len(failures)}\n")
              f.write(f"total={total}\n")
          PYEOF

      - name: Créer le label monitoring si absent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh label create "monitoring" \
            --color "0075ca" \
            --description "Rapports automatiques de monitoring aut_prep" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Créer l'issue de rapport quotidien
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TITLE="[Monitoring] aut_prep — ${{ steps.analyse.outputs.date }} ${{ steps.analyse.outputs.status_emoji }}"
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/report.md \
            --label "monitoring" \
            --repo "${{ github.repository }}"

      - name: Re-lancer les runs en echec (si < 10 echecs)
        if: steps.analyse.outputs.has_failures == 'true' && fromJSON(steps.analyse.outputs.fail_count) < 10
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          since = (datetime.now(timezone.utc) - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ")
          params = urllib.parse.urlencode({"per_page": 100, "page": 1})
          url = f"https://api.github.com/repos/{repo}/actions/workflows/auto_prepa.yml/runs?{params}"
          data = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=headers)).read())
          failures = [r for r in data.get("workflow_runs", [])
                      if r["created_at"] >= since and r["conclusion"] in ("failure", "timed_out")]

          for r in failures[:10]:
              rerun_url = f"https://api.github.com/repos/{repo}/actions/runs/{r['id']}/rerun-failed-jobs"
              req = urllib.request.Request(rerun_url, data=b"{}", headers=headers, method="POST")
              try:
                  urllib.request.urlopen(req)
                  print(f"  Re-lancé run #{r['run_number']} ({r['id']})")
              except Exception as e:
                  print(f"  Impossible de re-lancer run #{r['run_number']}: {e}")
          PYEOF
