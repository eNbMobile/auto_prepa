name: Manquants Drive → PDF

on:
  workflow_dispatch:

jobs:
  generer-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install \
            pdfplumber \
            reportlab \
            python-barcode[images] \
            Pillow \
            google-api-python-client \
            google-auth-oauthlib

      - name: Générer et déposer le PDF sur Drive
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python manquants/gen_rupture_sbs.py
