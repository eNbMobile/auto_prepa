name: CreerCADriveAnnee

# Crée le classeur « CA DRIVE <année> » sur Drive à partir de celui de l'année
# précédente (mêmes onglets et formules, données réelles vidées), dans le même
# dossier. Lancement manuel (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      annee:
        description: "Année à créer (AAAA) — vide : l'année prochaine"
        required: false
        type: string
      remplacer:
        description: "Écraser le classeur s'il existe déjà"
        required: false
        type: boolean
        default: false

concurrency:
  group: renseigne_ca
  cancel-in-progress: false

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Créer le classeur
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
          ANNEE: ${{ inputs.annee }}
          REMPLACER: ${{ inputs.remplacer }}
        run: |
          ARGS=""
          if [ -n "$ANNEE" ]; then ARGS="--annee $ANNEE"; fi
          if [ "$REMPLACER" = "true" ]; then ARGS="$ARGS --remplacer"; fi
          python3 bootstrap.py creer_ca_drive_annee.py $ARGS

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
          fi
