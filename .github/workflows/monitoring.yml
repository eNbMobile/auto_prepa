name: Monitoring aut_prep

on:
  schedule:
    - cron: '0 6 * * *'   # Tous les jours à 6h UTC
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Analyser les runs aut_prep (dernières 24h)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta

          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO     = os.environ["REPO"]

          H = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_get(path, params=None):
              url = f"https://api.github.com{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url, headers=H)) as r:
                  return json.loads(r.read())

          def api_post(path, body):
              data = json.dumps(body, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data,
                  headers={**H, "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # ── Récupérer tous les runs des 24 dernières heures ────────────────
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          since  = cutoff.strftime("%Y-%m-%dT%H:%M:%SZ")

          all_runs = []
          for page in range(1, 20):  # max 1900 runs
              data = api_get(
                  f"/repos/{REPO}/actions/workflows/auto_prepa.yml/runs",
                  {"per_page": 100, "page": page, "created": f">={since}"},
              )
              batch = data.get("workflow_runs", [])
              all_runs.extend(batch)
              if len(batch) < 100:
                  break

          runs = sorted(
              [r for r in all_runs
               if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) >= cutoff],
              key=lambda r: r["created_at"],
          )

          total     = len(runs)
          successes = [r for r in runs if r["conclusion"] == "success"]
          failures  = [r for r in runs if r["conclusion"] in
                       ("failure", "cancelled", "timed_out", "startup_failure")]
          pending   = [r for r in runs if r["status"] in ("queued", "in_progress", "waiting")]

          now_str  = datetime.now(timezone.utc).strftime("%d/%m/%Y a %H:%M UTC")
          date_str = datetime.now(timezone.utc).strftime("%d/%m/%Y")

          print(f"Runs aut_prep (24h) : {total} | Succes : {len(successes)} | Erreurs : {len(failures)} | En cours : {len(pending)}")

          # ── Détection des grandes interruptions (> 30 min sans aucun run) ──
          completed = [r for r in runs if r["status"] == "completed"]
          gaps = []
          for i in range(1, len(completed)):
              t1 = datetime.fromisoformat(completed[i-1]["created_at"].replace("Z", "+00:00"))
              t2 = datetime.fromisoformat(completed[i]["created_at"].replace("Z", "+00:00"))
              gap_min = (t2 - t1).total_seconds() / 60
              if gap_min > 30:
                  gaps.append((t1, t2, gap_min))

          # ── Résumé dans l'interface GitHub Actions ─────────────────────────
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "w", encoding="utf-8") as f:
                  f.write(f"## Monitoring aut_prep - {now_str}\n\n")
                  f.write("| Statut | Nombre |\n|--------|--------|\n")
                  f.write(f"| Succes | {len(successes)} |\n")
                  f.write(f"| Erreurs | {len(failures)} |\n")
                  f.write(f"| En cours | {len(pending)} |\n")
                  f.write(f"| **Total** | **{total}** |\n\n")
                  ok = not (total == 0 or failures or gaps)
                  f.write("**OK - aucun probleme detecte.**\n" if ok else
                          "**Problemes detectes - une issue GitHub a ete creee.**\n")

          has_problem = (total == 0 or bool(failures) or bool(gaps))

          if not has_problem:
              print("OK - aucun probleme detecte.")
              sys.exit(0)

          # ── Construire le rapport Markdown ─────────────────────────────────
          lines = [
              f"## Rapport monitoring aut_prep - {now_str}",
              "",
              "### Resume",
              "",
              "| Statut | Nombre |",
              "|--------|--------|",
              f"| Succes | {len(successes)} |",
              f"| Erreurs | {len(failures)} |",
              f"| En cours | {len(pending)} |",
              f"| **Total** | **{total}** |",
              "",
          ]

          if total == 0:
              lines += [
                  "### Aucun run detecte dans les 24 dernieres heures",
                  "",
                  "Le workflow `aut_prep` ne s'est pas execute depuis plus de 24h.",
                  "Verifier que **cron-job.org** declenche bien le workflow toutes les minutes via `workflow_dispatch`.",
                  "",
              ]

          if gaps:
              lines += ["### Interruptions detectees (> 30 min sans execution)", ""]
              for t1, t2, gap in gaps[:10]:
                  t1s = t1.strftime("%H:%M UTC")
                  t2s = t2.strftime("%H:%M UTC")
                  lines.append(f"- De `{t1s}` a `{t2s}` : **{gap:.0f} min** sans run")
              lines.append("")

          if failures:
              lines += ["### Runs en erreur", ""]
              for r in failures[:20]:
                  ts = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).strftime("%d/%m %H:%M UTC")
                  lines.append(
                      f"- `{ts}` - Run #{r['run_number']} - `{r['conclusion']}` - [Logs]({r['html_url']})"
                  )
                  try:
                      jobs_data = api_get(f"/repos/{REPO}/actions/runs/{r['id']}/jobs")
                      for job in jobs_data.get("jobs", []):
                          if job.get("conclusion") not in ("success", "skipped", None):
                              for step in job.get("steps", []):
                                  if step.get("conclusion") == "failure":
                                      lines.append(f"  - Etape en echec : **{step['name']}**")
                  except Exception:
                      pass
              lines.append("")

          report = "\n".join(lines)
          title  = f"[Monitoring] aut_prep - {len(failures)} erreur(s) - {date_str}"

          # Ne pas créer de doublon si une issue du jour existe déjà
          try:
              existing = api_get(f"/repos/{REPO}/issues", {"state": "open", "per_page": 30})
              for iss in existing:
                  if "[Monitoring] aut_prep" in iss.get("title", "") and date_str in iss.get("title", ""):
                      print(f"Issue du jour deja existante : {iss['html_url']}")
                      sys.exit(1)
          except Exception:
              pass

          try:
              issue = api_post(f"/repos/{REPO}/issues", {"title": title, "body": report})
              print(f"Issue creee : {issue['html_url']}")
          except Exception as e:
              print(f"ERREUR creation issue : {e}", file=sys.stderr)

          sys.exit(1)
          PYEOF
