name: Monitoring aut_prep

on:
  schedule:
    - cron: '0 7 * * *'   # tous les jours à 7h UTC
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Analyser les exécutions aut_prep (24h)
        id: analyse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.parse, zipfile, io
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def gh_get(url):
              req = urllib.request.Request(url, headers=headers)
              return json.loads(urllib.request.urlopen(req).read())

          # ── 1. Récupérer les runs des 24 dernières heures ──────────────────
          since = (datetime.now(timezone.utc) - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ")
          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/auto_prepa.yml/runs"
              f"?per_page=100&created=>={since}"
          )
          data = gh_get(runs_url)
          runs = data.get("workflow_runs", [])

          # Pagination (au-delà de 100 runs)
          while "next" in data.get("link_header", "") or False:
              break  # pour 288 runs/24h, 100 suffit — à étendre si besoin

          total      = len(runs)
          successes  = [r for r in runs if r["conclusion"] == "success"]
          failures   = [r for r in runs if r["conclusion"] in ("failure", "timed_out")]
          cancelled  = [r for r in runs if r["conclusion"] == "cancelled"]
          skipped    = [r for r in runs if r["conclusion"] == "skipped"]
          in_prog    = [r for r in runs if r["status"] in ("in_progress", "queued", "waiting")]

          print(f"=== Bilan aut_prep – {datetime.now(timezone.utc).strftime('%Y-%m-%d')} ===")
          print(f"Runs totaux  : {total}")
          print(f"  ✅ Succès  : {len(successes)}")
          print(f"  ❌ Échecs  : {len(failures)}")
          print(f"  🚫 Annulés : {len(cancelled)}")
          print(f"  ⏭  Ignorés : {len(skipped)}")
          print(f"  ⏳ En cours: {len(in_prog)}")

          # ── 2. Analyser les logs des runs en échec ─────────────────────────
          KNOWN_PATTERNS = [
              ("Token OAuth expiré / révoqué",
               ["invalid_grant", "Token has been expired", "invalid_token",
                "unauthorized_client"]),
              ("Dossier Drive introuvable",
               ["dossier", "introuvable", "DRIVE_CONFIG_FOLDER_ID"]),
              ("Script absent sur Drive",
               ["absent du dossier scripts", "auto_prepa.py absent"]),
              ("Secret manquant",
               ["GOOGLE_TOKEN_JSON manquant", "DRIVE_CONFIG_FOLDER_ID manquant",
                "secret"]),
              ("Erreur réseau / timeout",
               ["urlopen error", "timed out", "ConnectionReset", "RemoteDisconnected"]),
              ("Erreur Python (exception non gérée)",
               ["Traceback", "SyntaxError", "ImportError", "ModuleNotFoundError"]),
          ]

          failure_details = []
          for run in failures[:10]:          # limite à 10 pour éviter le rate-limit
              run_id   = run["id"]
              run_url  = run["html_url"]
              run_date = run["created_at"]
              diagnosis = "Cause inconnue — voir les logs"

              # Télécharger les logs (zip)
              try:
                  logs_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/logs"
                  req = urllib.request.Request(logs_url, headers=headers)
                  raw = urllib.request.urlopen(req).read()
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      log_text = ""
                      for name in zf.namelist():
                          log_text += zf.read(name).decode("utf-8", errors="replace")

                  for label, keywords in KNOWN_PATTERNS:
                      if any(k.lower() in log_text.lower() for k in keywords):
                          diagnosis = label
                          break
              except Exception as e:
                  diagnosis = f"Impossible de lire les logs : {e}"

              failure_details.append({
                  "id":        run_id,
                  "url":       run_url,
                  "date":      run_date,
                  "diagnosis": diagnosis,
              })
              print(f"  ❌ {run_date} → {diagnosis}  ({run_url})")

          # ── 3. Écrire le rapport dans un fichier (pour l'étape suivante) ──
          report = {
              "date":         datetime.now(timezone.utc).isoformat(),
              "total":        total,
              "successes":    len(successes),
              "failures":     len(failures),
              "cancelled":    len(cancelled),
              "skipped":      len(skipped),
              "in_progress":  len(in_prog),
              "failure_details": failure_details,
          }
          with open("monitoring_report.json", "w") as f:
              json.dump(report, f, indent=2)

          # Output pour l'étape suivante
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_failures={'true' if failures else 'false'}\n")
              f.write(f"failures_count={len(failures)}\n")
              f.write(f"total={total}\n")
          PYEOF

      # ── 4. Créer / mettre à jour l'Issue GitHub si des échecs sont détectés ──
      - name: Créer un rapport d'incident (Issue GitHub)
        if: steps.analyse.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          with open("monitoring_report.json") as f:
              report = json.load(f)

          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          n_fail   = report["failures"]
          total    = report["total"]

          # ── Corps de l'issue ──────────────────────────────────────────────
          body_lines = [
              f"## Rapport de monitoring – {date_str}",
              "",
              f"| Métrique | Valeur |",
              f"|----------|--------|",
              f"| Runs totaux (24h) | {total} |",
              f"| ✅ Succès | {report['successes']} |",
              f"| ❌ Échecs | {n_fail} |",
              f"| 🚫 Annulés | {report['cancelled']} |",
              f"| ⏭  Ignorés | {report['skipped']} |",
              "",
              "### Détail des échecs",
              "",
          ]

          for d in report["failure_details"]:
              body_lines += [
                  f"- **{d['date']}** — {d['diagnosis']}",
                  f"  → [Voir le run]({d['url']})",
              ]

          # Recommandations automatiques
          diagnoses = {d["diagnosis"] for d in report["failure_details"]}
          reco_lines = []
          if "Token OAuth expiré / révoqué" in diagnoses:
              reco_lines.append("- 🔑 **Renouveler le secret `GOOGLE_TOKEN_JSON`** : le token OAuth est expiré ou révoqué.")
          if "Dossier Drive introuvable" in diagnoses:
              reco_lines.append("- 📁 **Vérifier `DRIVE_CONFIG_FOLDER_ID`** : le dossier Drive de configuration est introuvable.")
          if "Script absent sur Drive" in diagnoses:
              reco_lines.append("- 📄 **Vérifier la présence de `auto_prepa.py`** dans le dossier `scripts/` sur Drive.")
          if "Secret manquant" in diagnoses:
              reco_lines.append("- ⚙️ **Vérifier les secrets GitHub** : `GOOGLE_TOKEN_JSON` ou `DRIVE_CONFIG_FOLDER_ID` sont absents.")
          if "Erreur réseau / timeout" in diagnoses:
              reco_lines.append("- 🌐 **Erreur réseau transitoire** : probablement temporaire, à surveiller si ça persiste.")
          if "Erreur Python (exception non gérée)" in diagnoses:
              reco_lines.append("- 🐛 **Exception Python** : consulter les logs détaillés pour corriger le code.")

          if reco_lines:
              body_lines += ["", "### Recommandations", ""] + reco_lines

          body_lines += [
              "",
              "---",
              f"*Rapport généré automatiquement le {date_str} par le workflow `monitoring_aut_prep`.*",
          ]
          body = "\n".join(body_lines)

          # ── Chercher une issue ouverte existante avec le même label ──────
          search_url = (
              f"https://api.github.com/repos/{repo}/issues"
              f"?labels=monitoring-aut_prep&state=open&per_page=5"
          )
          req  = urllib.request.Request(search_url, headers=headers)
          issues = json.loads(urllib.request.urlopen(req).read())

          if issues:
              # Mettre à jour la première issue ouverte
              issue_number = issues[0]["number"]
              title = f"[Monitoring] aut_prep – {n_fail} échec(s) détecté(s) le {date_str}"
              patch_url = f"https://api.github.com/repos/{repo}/issues/{issue_number}"
              payload = json.dumps({"title": title, "body": body}).encode()
              req = urllib.request.Request(patch_url, data=payload, headers=headers, method="PATCH")
              urllib.request.urlopen(req)
              print(f"Issue #{issue_number} mise à jour.")
          else:
              # Créer le label si nécessaire, puis créer l'issue
              # Créer le label (ignore l'erreur si déjà existant)
              try:
                  lbl_url = f"https://api.github.com/repos/{repo}/labels"
                  lbl_payload = json.dumps({
                      "name": "monitoring-aut_prep",
                      "color": "e11d48",
                      "description": "Rapport de monitoring du workflow aut_prep",
                  }).encode()
                  urllib.request.urlopen(
                      urllib.request.Request(lbl_url, data=lbl_payload, headers=headers)
                  )
              except Exception:
                  pass  # label déjà existant

              title = f"[Monitoring] aut_prep – {n_fail} échec(s) détecté(s) le {date_str}"
              issue_url = f"https://api.github.com/repos/{repo}/issues"
              payload = json.dumps({
                  "title": title,
                  "body": body,
                  "labels": ["monitoring-aut_prep"],
              }).encode()
              req = urllib.request.Request(issue_url, data=payload, headers=headers)
              resp = json.loads(urllib.request.urlopen(req).read())
              print(f"Issue créée : {resp['html_url']}")
          PYEOF

      # ── 5. Clôturer l'issue ouverte si tout va bien ──────────────────────
      - name: Clôturer l'issue de monitoring si aucun échec
        if: steps.analyse.outputs.has_failures == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          search_url = (
              f"https://api.github.com/repos/{repo}/issues"
              f"?labels=monitoring-aut_prep&state=open&per_page=5"
          )
          req    = urllib.request.Request(search_url, headers=headers)
          issues = json.loads(urllib.request.urlopen(req).read())

          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          for issue in issues:
              number = issue["number"]
              # Ajouter un commentaire de résolution
              comment_url = f"https://api.github.com/repos/{repo}/issues/{number}/comments"
              comment = json.dumps({
                  "body": f"✅ **Résolu** – Aucun échec détecté lors du contrôle du {date_str}. Issue clôturée automatiquement."
              }).encode()
              urllib.request.urlopen(
                  urllib.request.Request(comment_url, data=comment, headers=headers)
              )
              # Fermer l'issue
              patch_url = f"https://api.github.com/repos/{repo}/issues/{number}"
              urllib.request.urlopen(
                  urllib.request.Request(
                      patch_url,
                      data=json.dumps({"state": "closed"}).encode(),
                      headers=headers,
                      method="PATCH",
                  )
              )
              print(f"Issue #{number} clôturée (tout OK le {date_str}).")
          PYEOF

      - name: Résumé du monitoring
        run: |
          echo "### Résultat du monitoring aut_prep" >> $GITHUB_STEP_SUMMARY
          if [ -f monitoring_report.json ]; then
            python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          with open("monitoring_report.json") as f:
              r = json.load(f)

          lines = [
              f"| Runs (24h) | ✅ Succès | ❌ Échecs | 🚫 Annulés | ⏭ Ignorés |",
              f"|:---:|:---:|:---:|:---:|:---:|",
              f"| {r['total']} | {r['successes']} | {r['failures']} | {r['cancelled']} | {r['skipped']} |",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          with open(summary, "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF
          fi
