name: Surveillance Quotidienne aut_prep

on:
  schedule:
    - cron: '0 6 * * *'   # tous les jours à 6h UTC
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Fenêtre de vérification en heures (défaut: 24)"
        required: false
        default: "24"
        type: string

concurrency:
  group: surveillance_quotidienne
  cancel-in-progress: false

jobs:
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install anthropic

      - name: Configurer git pour les corrections automatiques
        run: |
          git config user.name  "Surveillance Bot"
          git config user.email "actions@github.com"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}

      - name: Calculer la fenêtre temporelle
        id: fenetre
        run: |
          HOURS="${{ inputs.since_hours }}"
          HOURS="${HOURS:-24}"
          echo "since_minutes=$(( HOURS * 60 ))" >> "$GITHUB_OUTPUT"

      - name: Lancer la surveillance (one-shot)
        env:
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_PATH:         ${{ github.workspace }}
          WORKFLOW_NAME:     "aut_prep"
          RUN_ONCE:          "1"
          SINCE_MINUTES:     ${{ steps.fenetre.outputs.since_minutes }}
          MAX_FIXES_PER_RUN: "10"
        run: python3 agents/agent3_github_watcher.py
