name: Deplacer commandes

# Inscrit la demande de déplacement d'un ou plusieurs BonDeCommande_NUMERO.pdf
# d'un jour à un autre (client qui n'est pas venu / commande décalée). Par
# défaut, le déplacement n'est pas fait tout de suite : il est effectué ce
# soir à 22h par deplacer_commandes_attente.yml, une fois les ventes et le CA
# du jour déjà calculés (sinon la commande déplacée disparaissait du CA
# quotidien alors qu'elle avait bien été préparée). Cocher "forcer" pour
# déplacer immédiatement (commande pas encore préparée).

on:
  workflow_dispatch:
    inputs:
      numeros:
        description: "Numéro(s) de commande — plusieurs possibles, séparés par des espaces ou des virgules"
        required: true
        type: string
      jour:
        description: "Jour cible (ignoré si une date est saisie ci-dessous)"
        required: true
        default: "lendemain de la commande"
        type: choice
        options:
          - "lendemain de la commande"
          - "aujourd'hui"
          - "demain"
          - "après-demain"
      date:
        description: "Ou date cible précise (JJ/MM/AAAA ou JJ/MM) — prioritaire sur le choix ci-dessus"
        required: false
        type: string
      forcer:
        description: "Forcer : déplacer tout de suite au lieu d'attendre ce soir 22h (commande pas préparée)"
        type: boolean
        default: false

concurrency:
  group: deplacer_commandes
  cancel-in-progress: false

jobs:
  deplacer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances pip
        run: pip install -r requirements.txt

      - name: Déplacer la ou les commandes
        env:
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_CONFIG_FOLDER_ID: ${{ secrets.DRIVE_CONFIG_FOLDER_ID }}
          WORK_DIR: "v 4.0.0"
          CDE_NUMEROS: ${{ inputs.numeros }}
          CDE_JOUR:    ${{ inputs.jour }}
          CDE_DATE:    ${{ inputs.date }}
          CDE_FORCER:  ${{ inputs.forcer && '--forcer' || '' }}
        run: |
          python3 deplacer_commande.py \
            --numeros "$CDE_NUMEROS" --jour "$CDE_JOUR" --date "$CDE_DATE" $CDE_FORCER

      - name: Mettre à jour GOOGLE_TOKEN_JSON si rafraîchi
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="$HOME/.auto_prepa_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
            echo "Secret GOOGLE_TOKEN_JSON mis à jour."
          fi
