name: Diagnostic gmailpush (temporaire)

# Workflow de diagnostic temporaire : affiche l'état du Durable Object
# "Debounce" du worker gmailpush, pour comprendre pourquoi plus aucun run
# aut_prep n'est déclenché automatiquement depuis le déploiement du Debounce
# (voir #337, #338). À supprimer une fois le diagnostic terminé.

on:
  workflow_dispatch:

jobs:
  etat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Interroger /etat du worker gmailpush
        env:
          GMAIL_PUSH_TOKEN: ${{ secrets.GMAIL_PUSH_TOKEN }}
          GMAILPUSH_URL:    ${{ vars.GMAILPUSH_URL || 'https://gmailpush.coopu.workers.dev' }}
        run: |
          if [ -z "$GMAIL_PUSH_TOKEN" ]; then
            echo "::error::GMAIL_PUSH_TOKEN absent."
            exit 1
          fi
          echo "::add-mask::$GMAIL_PUSH_TOKEN"
          code=$(curl -sS -o /tmp/etat.json -w "%{http_code}" \
            "${GMAILPUSH_URL}/etat?token=${GMAIL_PUSH_TOKEN}")
          echo "HTTP $code"
          cat /tmp/etat.json
          echo
