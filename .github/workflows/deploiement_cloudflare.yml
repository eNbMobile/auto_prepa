name: Déploiement Cloudflare

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker à déployer"
        required: true
        type: choice
        default: skyjo-worker
        options:
          - skyjo-worker
          - anticipation-worker
          - dashboard-worker

concurrency:
  group: deploiement_cloudflare
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Déployer le worker
        working-directory: cloudflare/${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
