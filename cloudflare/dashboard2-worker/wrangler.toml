name = "wf2"
# Même code que le worker "wf" : seules les variables ci-dessous changent.
main = "../dashboard-worker/src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Cartes / workflows retirés de cette page (clés de WORKFLOWS, séparées par des virgules).
MASQUER = "generer_ventes"
# Pas de lien "Voir tous les runs sur GitHub Actions" en bas de page.
SANS_LIEN_RUNS = "1"

# Secret à définir après le déploiement (ne jamais le mettre ici en clair) :
#   wrangler secret put GH_TOKEN
