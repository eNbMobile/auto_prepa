name = "gmailpush"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Déclencheurs planifiés (UTC) :
#  - toutes les 10 min : filet de sécurité aut_prep (bons déposés en
#    « Traitement manuel », notification Gmail perdue, rattrapage 14h
#    EN ATTENTE, alertes d'anticipation en attente). Le workflow garde sa
#    propre fenêtre horaire : la nuit, un seul passage par heure.
#  - 03h17 : renouvellement de la surveillance Gmail (users.watch expire au
#    bout de 7 jours).
[triggers]
crons = ["*/10 * * * *", "17 3 * * *"]

# Secrets (jamais en clair ici) :
#   GH_TOKEN      token GitHub autorisé à lancer les workflows du dépôt
#   PUBSUB_TOKEN  jeton secret présent dans l'URL de l'abonnement Pub/Sub
